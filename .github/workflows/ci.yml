name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check navsight tests
          ruff format --check navsight tests
      - name: Test
        run: python -m pytest
      - name: Simulator smoke run
        run: python -m navsight --sim --speed 0 --log-level WARNING
