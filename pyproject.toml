[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navsight"
version = "2.0.0"
description = "NavSight v2: multi-sensor smart cane software for people with visual impairment (Raspberry Pi 5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahim Trivedi" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pi = [
    "lgpio>=0.2",
    "pyserial>=3.5",
    "adafruit-blinka>=8.20",
    "adafruit-circuitpython-vl53l1x>=1.2",
    "adafruit-circuitpython-bno08x>=1.3",
    "adafruit-circuitpython-ina219>=3.4",
    "sounddevice>=0.4",
]
vision = ["ultralytics>=8.1", "opencv-python-headless>=4.8"]
depth = ["torch>=2.1", "timm>=0.9", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.5", "pyserial>=3.5"]

[project.scripts]
navsight = "navsight.__main__:main"

[tool.setuptools.packages.find]
include = ["navsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
